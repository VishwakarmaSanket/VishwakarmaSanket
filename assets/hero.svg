<svg
  width="1200"
  height="390"
  viewBox="0 0 1200 390"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Restrained brand accent -->
    <linearGradient
      id="accent"
      x1="70"
      y1="130"
      x2="650"
      y2="240"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#5666E8"/>
      <stop offset="1" stop-color="#7B86F5"/>
    </linearGradient>

    <!-- Extremely subtle background glow -->
    <radialGradient
      id="glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1050 70) rotate(135) scale(250)"
    >
      <stop
        stop-color="#6D7AF0"
        stop-opacity="0.09"
      />
      <stop
        offset="1"
        stop-color="#6D7AF0"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Fine technical grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        stroke="#111827"
        stroke-opacity="0.025"
        stroke-width="1"
      />
    </pattern>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    width="1200"
    height="390"
    rx="18"
    fill="#FAFAF9"

<svg
  width="1200"
  height="390"
  viewBox="0 0 1200 390"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#3A4150"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F5FE0"/>
      <stop offset="1" stop-color="#7B8CF0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(980 190) rotate(90) scale(260)">
      <stop stop-color="#3F5FE0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3F5FE0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#0E1117" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="390" rx="22" fill="#FAFAF8"/>
  <rect width="1200" height="390" rx="22" fill="url(#grid)"/>
  <circle cx="980" cy="190" r="260" fill="url(#glow)" filter="url(#soft)"/>

  <!-- FRAME -->
  <rect x="0.75" y="0.75" width="1198.5" height="388.5" rx="21.25"
    stroke="#1B1F2A" stroke-opacity="0.08"/>

  <!-- HEADER ROW -->
  <text x="60" y="58" fill="#1B1F2A" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="700" letter-spacing="3">
    SANKET VISHWAKARMA
  </text>

  <text x="60" y="78" fill="#8A8F99" font-family="'Inter', Arial, sans-serif"
    font-size="10.5" font-weight="500" letter-spacing="1.6">
    COMPUTER ENGINEERING · CLASS OF 2027 · PUNE, INDIA
  </text>

  <!-- STATUS PILL -->
  <rect x="978" y="38" width="164" height="30" rx="15" fill="#1B1F2A"/>
  <circle cx="998" cy="53" r="3.5" fill="#7CF29C"/>
  <text x="1010" y="57" fill="#FAFAF8" font-family="'Inter', Arial, sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="1.3">
    OPEN TO WORK
  </text>

  <!-- DIVIDER -->
  <line x1="60" y1="98" x2="1140" y2="98" stroke="#1B1F2A" stroke-opacity="0.07"/>

  <!-- HEADLINE -->
  <text x="58" y="188" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif"
    font-size="64" font-weight="400" letter-spacing="-2">
    Engineering products,
  </text>
  <text x="58" y="252" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif"
    font-size="64" font-weight="400" font-style="italic" letter-spacing="-2">
    with <tspan fill="url(#accent)">intent.</tspan>
  </text>

  <!-- SUBLINE -->
  <text x="60" y="286" fill="#6B7280" font-family="'Inter', Arial, sans-serif"
    font-size="14" font-weight="400">
    Full-stack &amp; AI engineer — building thoughtful software from idea to shipped product.
  </text>

  <!-- DISCIPLINE TAGS -->
  <g font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">
    <rect x="60" y="304" width="146" height="30" rx="15" fill="none" stroke="#1B1F2A" stroke-opacity="0.14"/>
    <text x="82" y="323" fill="#374151">Full-Stack (MERN)</text>

    <rect x="216" y="304" width="128" height="30" rx="15" fill="none" stroke="#1B1F2A" stroke-opacity="0.14"/>
    <text x="238" y="323" fill="#374151">Generative AI</text>

    <rect x="354" y="304" width="128" height="30" rx="15" fill="none" stroke="#1B1F2A" stroke-opacity="0.14"/>
    <text x="376" y="323" fill="#374151">Product Design</text>
  </g>

  <!-- ===================================================== -->
  <!-- APPROACH — Design × Development × AI (overlapping) -->
  <!-- ===================================================== -->

  <g font-family="'Inter', Arial, sans-serif">
    <text x="800" y="146" fill="#9CA0AA" font-size="10" font-weight="600" letter-spacing="2">
      HOW I WORK
    </text>

    <!-- overlapping circles -->
    <g opacity="0.92">
      <circle cx="882" cy="216" r="58" fill="#3F5FE0" fill-opacity="0.14" stroke="#3F5FE0" stroke-opacity="0.45"/>
      <circle cx="944" cy="196" r="58" fill="#7B8CF0" fill-opacity="0.14" stroke="#7B8CF0" stroke-opacity="0.45"/>
      <circle cx="944" cy="252" r="58" fill="#1B1F2A" fill-opacity="0.08" stroke="#1B1F2A" stroke-opacity="0.30"/>
    </g>

    <text x="850" y="200" text-anchor="middle" fill="#1B1F2A" font-size="11.5" font-weight="700">Design</text>
    <text x="965" y="176" text-anchor="middle" fill="#1B1F2A" font-size="11.5" font-weight="700">Develop</text>
    <text x="965" y="290" text-anchor="middle" fill="#1B1F2A" font-size="11.5" font-weight="700">AI</text>

    <!-- caption -->
    <text x="800" y="326" fill="#374151" font-size="12.5" font-weight="500">
      Design thinking, shipped through code,
    </text>
    <text x="800" y="344" fill="#374151" font-size="12.5" font-weight="500">
      accelerated by AI at every step.
    </text>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="358" x2="1140" y2="358" stroke="#1B1F2A" stroke-opacity="0.07"/>

  <text x="60" y="378" fill="#8A8F99" font-family="'Inter', Arial, sans-serif"
    font-size="10" font-weight="500" letter-spacing="1.6">
    SOFTWARE ENGINEERING · AI · UI/UX
  </text>

  <text x="1140" y="378" text-anchor="end" fill="#3F5FE0"
    font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">
    @VISHWAKARMASANKET
  </text>
</svg>

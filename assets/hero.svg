<svg
  width="1200"
  height="390"
  viewBox="0 0 1200 390"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- ================================================= -->
    <!-- BRAND ACCENT -->
    <!-- ================================================= -->

    <linearGradient
      id="accent"
      x1="250"
      y1="130"
      x2="720"
      y2="270"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#5969E8"/>
      <stop offset="1" stop-color="#8792F7"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- SOFT BLUE GLOW -->
    <!-- ================================================= -->

    <radialGradient
      id="blueGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(920 195) rotate(90) scale(220)"
    >
      <stop
        stop-color="#7B88F5"
        stop-opacity="0.20"
      />

      <stop
        offset="0.55"
        stop-color="#AEB6FF"
        stop-opacity="0.08"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </radialGradient>


    <!-- ================================================= -->
    <!-- ABSTRACT ORBIT GRADIENT -->
    <!-- ================================================= -->

    <linearGradient
      id="orbit"
      x1="760"
      y1="90"
      x2="1100"
      y2="330"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        stop-color="#6D7CF1"
        stop-opacity="0.38"
      />

      <stop
        offset="1"
        stop-color="#B7BFFF"
        stop-opacity="0.04"
      />
    </linearGradient>


    <!-- ================================================= -->
    <!-- VERY SUBTLE GRID -->
    <!-- ================================================= -->

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        stroke="#10131A"
        stroke-opacity="0.025"
        stroke-width="1"
      />
    </pattern>


    <!-- ================================================= -->
    <!-- SOFT BLUR -->
    <!-- ================================================= -->

    <filter
      id="blur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="24"/>
    </filter>


    <!-- ================================================= -->
    <!-- ORB -->
    <!-- ================================================= -->

    <radialGradient
      id="orb"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 205) rotate(90) scale(145)"
    >
      <stop
        stop-color="#E9ECFF"
        stop-opacity="0.95"
      />

      <stop
        offset="0.65"
        stop-color="#DCE1FF"
        stop-opacity="0.65"
      />

      <stop
        offset="1"
        stop-color="#F6F7FF"
        stop-opacity="0"
      />
    </radialGradient>

  </defs>



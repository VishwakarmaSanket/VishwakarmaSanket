<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="em-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F5FE0"/>
      <stop offset="1" stop-color="#7B8CF0"/>
    </linearGradient>
    <pattern id="em-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#0E1117" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="#FAFAF8"/>
  <rect width="1200" height="300" rx="22" fill="url(#em-grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.25" stroke="#1B1F2A" stroke-opacity="0.08"/>

  <text x="60" y="52" fill="#1B1F2A" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="700" letter-spacing="2.4">
    ENGINEERING MAP
  </text>
  <text x="60" y="72" fill="#8A8F99" font-family="'Inter',Arial,sans-serif"
    font-size="10.5" font-weight="500" letter-spacing="1.4">
    HOW THE LAYERS FIT TOGETHER
  </text>

  <!-- connecting flow line behind cards -->
  <line x1="150" y1="185" x2="1050" y2="185" stroke="url(#em-accent)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- arrowheads between cards -->
  <g fill="#3F5FE0" fill-opacity="0.55">
    <path d="M338 185 L328 180 L328 190 Z"/>
    <path d="M598 185 L588 180 L588 190 Z"/>
    <path d="M858 185 L848 180 L848 190 Z"/>
  </g>

  <!-- CARD 1 : PRODUCT -->
  <g>
    <rect x="60" y="110" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#1B1F2A" stroke-opacity="0.10"/>
    <circle cx="90" cy="140" r="4" fill="#3F5FE0"/>
    <text x="106" y="145" fill="#9CA0AA" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8">01</text>
    <text x="84" y="172" fill="#1B1F2A" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">PRODUCT</text>
    <text x="84" y="196" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">UX research</text>
    <text x="84" y="216" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Design systems</text>
    <text x="84" y="236" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Figma · Framer</text>
  </g>

  <!-- CARD 2 : APPLICATIONS -->
  <g>
    <rect x="320" y="110" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#1B1F2A" stroke-opacity="0.10"/>
    <circle cx="350" cy="140" r="4" fill="#3F5FE0"/>
    <text x="366" y="145" fill="#9CA0AA" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8">02</text>
    <text x="344" y="172" fill="#1B1F2A" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">APPLICATIONS</text>
    <text x="344" y="196" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">React · Next.js</text>
    <text x="344" y="216" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Node.js · Express</text>
    <text x="344" y="236" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">REST · WebSockets</text>
  </g>

  <!-- CARD 3 : AI SYSTEMS -->
  <g>
    <rect x="580" y="110" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#3F5FE0" stroke-opacity="0.30"/>
    <circle cx="610" cy="140" r="4" fill="#3F5FE0"/>
    <text x="626" y="145" fill="#9CA0AA" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8">03</text>
    <text x="604" y="172" fill="#1B1F2A" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">AI SYSTEMS</text>
    <text x="604" y="196" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">LangChain · LangGraph</text>
    <text x="604" y="216" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">RAG pipelines</text>
    <text x="604" y="236" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Agentic workflows</text>
  </g>

  <!-- CARD 4 : INFRASTRUCTURE -->
  <g>
    <rect x="840" y="110" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#1B1F2A" stroke-opacity="0.10"/>
    <circle cx="870" cy="140" r="4" fill="#3F5FE0"/>
    <text x="886" y="145" fill="#9CA0AA" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8">04</text>
    <text x="864" y="172" fill="#1B1F2A" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">INFRASTRUCTURE</text>
    <text x="864" y="196" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Docker · Kubernetes</text>
    <text x="864" y="216" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">MongoDB · Redis</text>
    <text x="864" y="236" fill="#6B7280" font-family="'Inter',Arial,sans-serif" font-size="11">Git · CI/CD</text>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="278" x2="1140" y2="278" stroke="#1B1F2A" stroke-opacity="0.07"/>
  <text x="60" y="294" fill="#8A8F99" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="500" letter-spacing="1.4">
    IDEA → INTERFACE → SYSTEM → SHIPPED
  </text>
</svg>
